<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VELA Scent — Hệ Thống Quản Trị & Điều Hành Bán Hàng</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#141414',
            'charcoal-light': '#1F1F1F',
            'charcoal-card': '#242424',
            'amber-vela': '#C5A880',
            'amber-light': '#E8D8C3',
            'amber-pale': '#F4EFEA',
            cream: '#FAF8F5',
            'cream-light': '#FDFBF7',
            ivory: '#FDFCFA',
            muted: '#78716C',
            border: '#E8E2D9'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: #F8F6F0; color: #141414; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-[#F8F6F0] text-charcoal antialiased">
  <div id="admin-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- SAFE STORAGE HELPER ---
    const safeStorage = {
      getItem: (key) => {
        try {
          return (typeof window !== 'undefined' && window.localStorage) ? window.localStorage.getItem(key) : null;
        } catch (e) {
          return null;
        }
      },
      setItem: (key, val) => {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(key, val);
          }
        } catch (e) {}
      },
      removeItem: (key) => {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.removeItem(key);
          }
        } catch (e) {}
      }
    };

    // --- CURRENCY FORMATTER ---
    const formatVND = (num) => {
      if (!num && num !== 0) return '0 đ';
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num).replace('₫', 'đ');
    };

    // --- BUILT-IN LUCIDE ICONS ---
    function Icon({ name, className = "w-5 h-5" }) {
      const icons = {
        dashboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        orders: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />,
        products: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />,
        customers: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />,
        blog: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        external: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
        print: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      };

      return (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          {icons[name] || icons.dashboard}
        </svg>
      );
    }

    // --- MAIN ADMIN APP (100% Real-Time Synchronized with Storefront) ---
    function AdminApp() {
      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return safeStorage.getItem('vela_admin_logged') === 'true';
      });
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      // Navigation View: 'dashboard', 'orders', 'products', 'customers', 'blog', 'settings'
      const [activeTab, setActiveTab] = useState('dashboard');

      // Orders State (synced with localStorage 'vela_orders' - 100% Real Orders Only)
      const [orders, setOrders] = useState(() => {
        try {
          const saved = safeStorage.getItem('vela_orders');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch(e) {}
        return [];
      });

      // Save orders whenever they change
      useEffect(() => {
        try {
          safeStorage.setItem('vela_orders', JSON.stringify(orders));
        } catch(e) {}
      }, [orders]);

      // Selected Order Modal & Print
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');

      // Toast notification
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Handle Login
      const handleLogin = (e) => {
        e.preventDefault();
        if ((username === 'admin' || username === 'long') && (password === 'vela2026' || password === 'admin' || password === '123456')) {
          setIsAuthenticated(true);
          safeStorage.setItem('vela_admin_logged', 'true');
          setLoginError('');
          showToast('Đăng nhập thành công! Chào mừng Founder Hoàng Thế Long.');
        } else {
          setLoginError('Tài khoản hoặc mật khẩu không chính xác. Mặc định: admin / vela2026');
        }
      };

      // Handle Logout
      const handleLogout = () => {
        setIsAuthenticated(false);
        safeStorage.removeItem('vela_admin_logged');
      };

      // Change Order Status
      const updateOrderStatus = (orderCode, newStatus) => {
        setOrders(prev => prev.map(o => o.code === orderCode ? { ...o, status: newStatus } : o));
        if (selectedOrder && selectedOrder.code === orderCode) {
          setSelectedOrder(prev => ({ ...prev, status: newStatus }));
        }
        showToast(`Đã đổi trạng thái đơn #${orderCode} sang "${getStatusLabel(newStatus)}"`);
      };

      const getStatusLabel = (st) => {
        switch(st) {
          case 'paid': return 'Đã thanh toán (VietQR)';
          case 'processing': return 'Đang đóng gói';
          case 'shipping': return 'Đang giao hàng';
          case 'completed': return 'Đã hoàn tất';
          case 'cancelled': return 'Đã hủy';
          default: return 'Chờ thanh toán';
        }
      };

      const getStatusBadge = (st) => {
        switch(st) {
          case 'paid':
            return <span className="bg-emerald-100 text-emerald-800 border border-emerald-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Đã thanh toán (VietQR)</span>;
          case 'processing':
            return <span className="bg-amber-100 text-amber-800 border border-amber-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Đang đóng gói</span>;
          case 'shipping':
            return <span className="bg-blue-100 text-blue-800 border border-blue-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>Đang giao hàng</span>;
          case 'completed':
            return <span className="bg-stone-100 text-stone-800 border border-stone-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-stone-500"></span>Hoàn tất</span>;
          case 'cancelled':
            return <span className="bg-red-100 text-red-800 border border-red-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>Đã hủy</span>;
          default:
            return <span className="bg-yellow-100 text-yellow-800 border border-yellow-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>Chờ xử lý</span>;
        }
      };

      // Filtered Orders
      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          const matchStatus = statusFilter === 'all' || o.status === statusFilter;
          const q = searchQuery.toLowerCase().trim();
          const matchQuery = !q || 
            (o.code && o.code.toLowerCase().includes(q)) ||
            (o.customer && o.customer.fullName && o.customer.fullName.toLowerCase().includes(q)) ||
            (o.customer && o.customer.phone && o.customer.phone.includes(q));
          return matchStatus && matchQuery;
        });
      }, [orders, statusFilter, searchQuery]);

      // Calculate Stats
      const totalRevenue = useMemo(() => {
        return orders
          .filter(o => o.status === 'paid' || o.status === 'completed' || o.status === 'shipping')
          .reduce((sum, o) => sum + (o.finalTotal || 0), 0);
      }, [orders]);

      const vietQrOrdersCount = useMemo(() => {
        return orders.filter(o => o.paymentMethod === 'vietqr').length;
      }, [orders]);

      // Extract unique customers for CRM
      const customersList = useMemo(() => {
        const map = {};
        orders.forEach(o => {
          if (!o.customer || !o.customer.phone) return;
          const phone = o.customer.phone;
          if (!map[phone]) {
            map[phone] = {
              fullName: o.customer.fullName || 'Khách vãng lai',
              phone: phone,
              email: o.customer.email || 'Chưa cung cấp',
              city: o.customer.city || 'Chưa rõ',
              address: o.customer.address || '',
              totalSpent: 0,
              orderCount: 0,
              lastOrderDate: o.createdAt
            };
          }
          map[phone].totalSpent += (o.finalTotal || 0);
          map[phone].orderCount += 1;
        });
        return Object.values(map);
      }, [orders]);

      // Export Customers to CSV
      const exportCustomersToCSV = () => {
        const headers = ["Ho va Ten", "So Dien Thoai", "Email", "Tinh Thanh", "Dia Chi", "So Don Hang", "Tong Chi Tieu (VND)", "Ngay Dat Gan Nhat"];
        const rows = customersList.map(c => [
          `"${c.fullName}"`,
          `"${c.phone}"`,
          `"${c.email}"`,
          `"${c.city}"`,
          `"${c.address.replace(/"/g, '""')}"`,
          c.orderCount,
          c.totalSpent,
          `"${c.lastOrderDate}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\r\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `danh_sach_khach_hang_vela_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Đã tải về danh sách khách hàng VELA (.csv)");
      };

      // --- IF NOT LOGGED IN: SHOW LUXURY LOGIN SCREEN ---
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-charcoal flex items-center justify-center p-4">
            <div className="bg-[#1C1917] border border-amber-vela/40 rounded-2xl max-w-md w-full p-8 shadow-2xl relative overflow-hidden animate-fade-in text-ivory">
              <div className="absolute top-0 right-0 w-32 h-32 bg-amber-vela/10 rounded-full blur-2xl pointer-events-none"></div>
              
              <div className="text-center space-y-2 mb-8">
                <div className="inline-flex p-3 rounded-full bg-amber-vela/15 border border-amber-vela/30 text-amber-vela mb-2">
                  <Icon name="sparkles" className="w-8 h-8" />
                </div>
                <h1 className="font-serif text-3xl font-bold tracking-widest text-ivory">V E L A</h1>
                <p className="text-[11px] uppercase tracking-[0.25em] text-amber-vela font-semibold">HỆ THỐNG QUẢN TRỊ THƯƠNG HIỆU</p>
                <p className="text-xs text-muted">Dành riêng cho Founder Hoàng Thế Long & Quản lý</p>
              </div>

              {loginError && (
                <div className="mb-4 p-3 bg-red-950/60 border border-red-800 text-red-200 text-xs rounded-lg flex items-center gap-2">
                  <span>⚠️</span>
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4 text-xs font-body">
                <div>
                  <label className="block text-ivory/80 mb-1 font-medium">Tên đăng nhập</label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full bg-[#121212] border border-border/30 rounded-lg px-3.5 py-2.5 text-ivory outline-none focus:border-amber-vela transition-colors"
                    placeholder="admin hoặc long"
                    required
                  />
                </div>

                <div>
                  <label className="block text-ivory/80 mb-1 font-medium">Mật khẩu bảo mật</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-[#121212] border border-border/30 rounded-lg px-3.5 py-2.5 text-ivory outline-none focus:border-amber-vela transition-colors"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <div className="flex items-center justify-between text-[11px] text-muted pt-1">
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" defaultChecked className="rounded accent-amber-vela" />
                    <span>Ghi nhớ phiên làm việc</span>
                  </label>
                  <span className="text-amber-vela/80 italic">Mặc định: vela2026</span>
                </div>

                <button
                  type="submit"
                  className="w-full bg-amber-vela hover:bg-amber-300 text-charcoal font-semibold py-3 rounded-lg text-xs uppercase tracking-wider transition-all shadow-lg hover:shadow-amber-vela/20 mt-2"
                >
                  ĐĂNG NHẬP HỆ THỐNG
                </button>
              </form>

              <div className="mt-8 pt-4 border-t border-white/10 text-center">
                <a 
                  href="./index.html" 
                  className="text-xs text-muted hover:text-amber-vela flex items-center justify-center gap-1.5 transition-colors"
                >
                  <span>← Quay lại Website Cửa Hàng VELA</span>
                </a>
              </div>
            </div>
          </div>
        );
      }

      // --- LOGGED IN: MAIN DASHBOARD VIEW ---
      return (
        <div className="min-h-screen flex bg-[#F8F6F0]">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-charcoal text-ivory border border-amber-vela px-4 py-3 rounded-xl shadow-2xl text-xs flex items-center gap-2 animate-bounce">
              <span className="text-amber-vela">✨</span>
              <span>{toast}</span>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="w-64 bg-charcoal text-ivory shrink-0 flex flex-col justify-between border-r border-white/10 z-20">
            <div>
              {/* Brand Header */}
              <div className="p-6 border-b border-white/10 flex items-center justify-between">
                <div>
                  <div className="font-serif text-2xl font-bold tracking-widest text-ivory">V E L A</div>
                  <div className="text-[9px] tracking-[0.25em] text-amber-vela uppercase font-semibold">ADMIN PORTAL</div>
                </div>
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" title="Hệ thống trực tuyến"></span>
              </div>

              {/* User Profile */}
              <div className="px-6 py-4 bg-white/5 border-b border-white/5 flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-amber-vela/20 border border-amber-vela text-amber-vela flex items-center justify-center font-bold text-xs">
                  HTL
                </div>
                <div className="min-w-0">
                  <div className="font-semibold text-xs truncate">Hoàng Thế Long</div>
                  <div className="text-[10px] text-muted">Founder & Quản Trị Viên</div>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="p-3 space-y-1 text-xs font-medium">
                {[
                  { id: 'dashboard', label: 'Tổng Quan', icon: 'dashboard' },
                  { id: 'orders', label: 'Quản Lý Đơn Hàng', icon: 'orders', badge: orders.length },
                  { id: 'products', label: 'Sản Phẩm & Kho', icon: 'products' },
                  { id: 'customers', label: 'Khách Hàng (CRM)', icon: 'customers', badge: customersList.length },
                  { id: 'blog', label: 'Bài Viết Blog (CMS)', icon: 'blog' },
                  { id: 'settings', label: 'Cài Đặt & VietQR', icon: 'settings' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg transition-all ${
                      activeTab === item.id 
                        ? 'bg-amber-vela text-charcoal font-semibold shadow-xs' 
                        : 'text-ivory/80 hover:bg-white/10 hover:text-ivory'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <Icon name={item.icon} className="w-4 h-4" />
                      <span>{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                        activeTab === item.id ? 'bg-charcoal text-ivory' : 'bg-white/15 text-ivory'
                      }`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            {/* Sidebar Footer */}
            <div className="p-4 border-t border-white/10 space-y-2 text-xs">
              <a
                href="./index.html"
                target="_blank"
                className="w-full py-2 px-3 bg-white/10 hover:bg-white/15 text-ivory rounded-lg flex items-center justify-center gap-2 transition-colors font-medium text-xs"
              >
                <Icon name="external" className="w-3.5 h-3.5" />
                <span>Xem Website Cửa Hàng</span>
              </a>

              <button
                onClick={handleLogout}

                <div className="bg-white p-5 rounded-xl border border-border shadow-xs flex items-center justify-between">
                  <div>
                    <h3 className="font-serif font-bold text-lg text-charcoal">Tạp Chí Mùi Hương & Bài Viết Blog</h3>
                    <p className="text-xs text-muted">Đăng bài viết chia sẻ kiến thức phong cách sống và câu chuyện thương hiệu</p>
                  </div>
                  <a
                    href="./index.html#blog"
                    target="_blank"
                    className="bg-charcoal hover:bg-amber-vela text-ivory hover:text-charcoal px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"
                  >
                    <span>Xem Trang Blog Ngoài Web →</span>
                  </a>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {[
                    { title: "Hành Trình VELA: Từ Niềm Đam Mê Đến Xưởng Nến Thủ Công Sáp Đậu Nành 100%", author: "Hoàng Thế Long", date: "20/11/2026", cat: "Hành Trình Khởi Nghiệp" },
                    { title: "Nghệ Thuật Đốt Nến Không Bị Lõm Mặt (Tunneling) & Tối Ưu Tỏa Hương", author: "Chuyên gia VELA", date: "18/11/2026", cat: "Kiến Thức Nến Thơm" },
                    { title: "Sự Khác Biệt Giữa 100% Sáp Đậu Nành Organic Và Sáp Paraffin Công Nghiệp", author: "Hoàng Thế Long", date: "15/11/2026", cat: "Sức Khỏe & Liệu Pháp" }
                  ].map((b, i) => (
                    <div key={i} className="bg-white p-5 rounded-xl border border-border shadow-xs space-y-2">
                      <span className="text-[10px] uppercase font-bold text-amber-vela">{b.cat}</span>
                      <h4 className="font-serif font-bold text-base text-charcoal">{b.title}</h4>
                      <div className="text-[11px] text-muted flex items-center gap-2">
                        <span>Tác giả: {b.author}</span>
                        <span>•</span>
                        <span>{b.date}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 6: SETTINGS & VIETQR GATEWAY */}
            {activeTab === 'settings' && (
              <div className="bg-white p-6 rounded-xl border border-border shadow-xs max-w-2xl space-y-6 animate-fade-in">
                <div>
                  <h3 className="font-serif font-bold text-lg text-charcoal">Cấu Hình Cổng Thanh Toán & Thương Hiệu</h3>
                  <p className="text-xs text-muted">Thông tin tài khoản nhận tiền và hiển thị trên toàn hệ thống</p>
                </div>

                <div className="space-y-4 text-xs font-body">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-muted mb-1 font-medium">Ngân hàng thụ hưởng</label>
                      <input type="text" readOnly value="Techcombank (TCB)" className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 font-semibold text-charcoal outline-none" />
                    </div>
                    <div>
                      <label className="block text-muted mb-1 font-medium">Số tài khoản Techcombank</label>
                      <input type="text" readOnly value="333330012003" className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 font-mono font-bold text-charcoal outline-none" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-muted mb-1 font-medium">Tên chủ tài khoản</label>
                    <input type="text" readOnly value="HOANG THE LONG" className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 font-bold text-charcoal outline-none" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-muted mb-1 font-medium">Hotline & Zalo chính thức</label>
                      <input type="text" readOnly value="0358 500 914" className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 font-bold text-charcoal outline-none" />
                    </div>
                    <div>
                      <label className="block text-muted mb-1 font-medium">Định dạng mã VietQR</label>
                      <input type="text" readOnly value="VietQR Napas 24/7 Chuẩn Tự Động" className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 text-charcoal outline-none" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-muted mb-1 font-medium">Địa chỉ Showroom VELA</label>
                    <input type="text" readOnly value="Tòa nhà Scent Tower, Phố Liễu Giai, Ba Đình, Hà Nội" className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 text-charcoal outline-none" />
                  </div>

                  <div className="pt-4 border-t border-border space-y-3">
                    <h4 className="font-serif font-bold text-sm text-charcoal flex items-center gap-2">
                      <span>📊</span>
                      <span>Kết Nối Google Analytics 4 (GA4) & Google Search Console</span>
                    </h4>
                    <p className="text-[11px] text-muted">
                      Nhập mã Google Analytics và mã xác minh Google Search Console của bạn để kích hoạt đo lường traffic và SEO tự động.
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-muted mb-1 font-medium">Google Analytics 4 (Measurement ID)</label>
                        <input
                          type="text"
                          defaultValue={safeStorage.getItem('vela_ga_id') || 'G-VELASCENT'}
                          onChange={(e) => safeStorage.setItem('vela_ga_id', e.target.value)}
                          placeholder="G-XXXXXXXXXX"
                          className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 font-mono text-xs text-charcoal outline-none focus:border-amber-vela"
                        />
                      </div>
                      <div>
                        <label className="block text-muted mb-1 font-medium">Google Search Console (HTML Tag Code)</label>
                        <input
                          type="text"
                          defaultValue={safeStorage.getItem('vela_gsc_code') || 'pf9VB4tTrAwelQiK-X9lw2YH4vX6CRF0U7_4lkfX44I'}
                          onChange={(e) => safeStorage.setItem('vela_gsc_code', e.target.value)}
                          placeholder="Mã xác thực Google (content)"
                          className="w-full bg-[#FAF8F5] border border-border rounded-lg px-3.5 py-2 font-mono text-xs text-charcoal outline-none focus:border-amber-vela"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-2">
                    <button
                      onClick={() => showToast('Cấu hình thương hiệu VELA đang hoạt động chính xác 100%')}
                      className="bg-charcoal hover:bg-amber-vela text-ivory hover:text-charcoal px-5 py-2.5 rounded-lg text-xs font-semibold transition-colors shadow-xs"
                    >
                      Lưu Thay Đổi
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        if (window.confirm('Bạn có chắc chắn muốn xóa sạch toàn bộ đơn hàng và đưa doanh thu về 0 đ?')) {
                          setOrders([]);
                          safeStorage.removeItem('vela_orders');
                          showToast('Đã xóa sạch đơn hàng! Doanh thu đã về 0 đ.');
                        }
                      }}
                      className="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 px-4 py-2.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5"
                    >
                      <span>🗑️</span>
                      <span>Xóa sạch đơn hàng (Reset về 0)</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ORDER DETAIL & SHIPPING LABEL MODAL */}
          {selectedOrder && (
            <div className="fixed inset-0 z-50 bg-charcoal/70 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-border text-xs flex flex-col">
                
                {/* Modal Header */}
                <div className="p-5 border-b border-border flex items-center justify-between bg-cream">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-amber-vela tracking-wider">CHI TIẾT ĐƠN HÀNG</span>
                    <h3 className="font-serif font-bold text-lg text-charcoal">#{selectedOrder.code}</h3>
                  </div>
                  <button 
                    onClick={() => setSelectedOrder(null)}
                    className="p-1 text-muted hover:text-charcoal rounded-full"
                  >
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                {/* Printable Shipping Slip Area */}
                <div id="printable-area" className="p-6 space-y-4">
                  {/* Sender & Receiver Info */}
                  <div className="grid grid-cols-2 gap-4 pb-4 border-b border-border text-xs">
                    <div>
                      <div className="text-[10px] uppercase font-bold text-muted mb-1">NGƯỜI GỬI:</div>
                      <div className="font-bold text-charcoal">VELA Scent — Nến Thơm Cao Cấp</div>
                      <div className="text-muted">Hotline/Zalo: 0358 500 914</div>
                      <div className="text-muted text-[11px]">Scent Tower, Liễu Giai, Ba Đình, Hà Nội</div>
                    </div>

                    <div>
                      <div className="text-[10px] uppercase font-bold text-muted mb-1">NGƯỜI NHẬN:</div>
                      <div className="font-bold text-charcoal">{selectedOrder.customer?.fullName}</div>
                      <div className="text-charcoal font-semibold">{selectedOrder.customer?.phone}</div>
                      <div className="text-muted text-[11px] leading-relaxed">
                        {selectedOrder.customer?.address}, {selectedOrder.customer?.city}
                      </div>
                    </div>
                  </div>

                  {/* Customer Note */}
                  {selectedOrder.customer?.note && (
                    <div className="p-2.5 bg-amber-pale border border-amber-vela/40 rounded-lg text-[11px]">
                      <strong>Ghi chú của khách:</strong> {selectedOrder.customer.note}
                    </div>
                  )}

                  {/* Order Items */}
                  <div className="space-y-2">
                    <div className="text-[10px] uppercase font-bold text-muted">DANH SÁCH MẶT HÀNG:</div>
                    <div className="divide-y divide-border/60">
                      {selectedOrder.items?.map((it, idx) => (
                        <div key={idx} className="py-2 flex items-center justify-between">
                          <div>
                            <div className="font-semibold text-charcoal">{it.name}</div>
                            <div className="text-[10px] text-muted">{it.sizeLabel} • SL: {it.quantity}</div>
                          </div>
                          <div className="font-bold text-charcoal">{formatVND(it.price * it.quantity)}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Order Summary */}
                  <div className="pt-3 border-t border-border space-y-1 text-right">
                    <div className="flex justify-between text-muted">
                      <span>Tiền hàng:</span>
                      <span>{formatVND(selectedOrder.cartTotal)}</span>
                    </div>
                    <div className="flex justify-between text-muted">
                      <span>Phí vận chuyển:</span>
                      <span>{selectedOrder.shippingFee === 0 ? "MIỄN PHÍ" : formatVND(selectedOrder.shippingFee)}</span>
                    </div>
                    <div className="flex justify-between font-serif font-bold text-base text-charcoal pt-1 border-t border-border/60">
                      <span>Tổng tiền thu:</span>
                      <span className="text-amber-vela">{formatVND(selectedOrder.finalTotal)}</span>
                    </div>
                    <div className="text-[10px] text-muted pt-1">
                      Hình thức thanh toán: <strong>{selectedOrder.paymentMethod === 'vietqr' ? 'ĐÃ THANH TOÁN VIETQR (Napas 24/7)' : 'THU TIỀN TẬN NƠI (COD)'}</strong>
                    </div>
                  </div>
                </div>

                {/* Modal Footer Actions */}
                <div className="p-4 bg-cream border-t border-border flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => window.print()}
                      className="bg-charcoal text-ivory hover:bg-amber-vela hover:text-charcoal px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"
                    >
                      <Icon name="print" className="w-3.5 h-3.5" />
                      <span>In Phiếu Giao Hàng</span>
                    </button>
                    {selectedOrder.customer?.phone && (
                      <a
                        href={`https://zalo.me/${selectedOrder.customer.phone}`}
                        target="_blank"
                        rel="noreferrer"
                        className="bg-[#0068FF] text-white px-3 py-2 rounded-lg text-xs font-semibold hover:opacity-90 inline-block"
                      >
                        Nhắn Zalo Khách
                      </a>
                    )}
                  </div>

                  <button
                    onClick={() => setSelectedOrder(null)}
                    className="border border-border hover:border-charcoal px-4 py-2 rounded-lg text-xs font-medium"
                  >
                    Đóng
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render Admin App
    const root = ReactDOM.createRoot(document.getElementById('admin-root'));
    root.render(<AdminApp />);
  </script>
</body>
