          return BLOG_POSTS;
        }
      });

      }, [blogPosts]);

      // Save Cart to LocalStorage
      useEffect(() => {
        try {

        } catch (e) {}
      }, [cart]);

      // Direct Navigation Handler
      const navigateTo = (page, category = 'all') => {
        setCurrentPage(page);
        setCurrentCategory(category || 'all');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const addToCart = (product, size = null, quantity = 1) => {
        const chosenSize = size || (product.sizes ? product.sizes[0] : { label: 'Tiêu chuẩn', weight: product.weight, price: product.price });
        const cartId = `${product.id}-${chosenSize.label}`;

        setCart(prev => {
          const existing = prev.find(item => item.id === cartId);
          if (existing) {
            return prev.map(item => item.id === cartId ? { ...item, quantity: item.quantity + quantity } : item);
          }
          return [...prev, {
            id: cartId,
            productId: product.id,
            name: product.name,
            subtitle: product.subtitle,
            sizeLabel: chosenSize.label,
            weight: chosenSize.weight,
            price: chosenSize.price,
            image: product.images[0],
            quantity: quantity
          }];
        });

        showToast(`Đã thêm ${product.name} vào giỏ hàng`);
        setIsCartOpen(true);
      };

      const updateQuantity = (cartId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === cartId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (cartId) => {
        setCart(prev => prev.filter(item => item.id !== cartId));
      };

      const cartCount = useMemo(() => cart.reduce((sum, item) => sum + item.quantity, 0), [cart]);
      const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + item.price * item.quantity, 0), [cart]);

    // --- PRODUCT WHEEL CAROUSEL COMPONENT ---
    function ProductWheelCarousel({ products, onSelectProduct, navigateTo, showToast }) {
      const wheelRef = useRef(null);
      const [spinningId, setSpinningId] = useState(null);

      const scrollWheel = (dir) => {
        if (wheelRef.current) {
          wheelRef.current.scrollBy({ left: dir === 'left' ? -320 : 320, behavior: 'smooth' });
        }
      };

      const handleItemClick = (product, index) => {
        setSpinningId(product.id);

        if (wheelRef.current) {
          const container = wheelRef.current;
          const cardWidth = 110;
          const targetScroll = (index * cardWidth) - (container.clientWidth / 2) + (cardWidth / 2);
          container.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });
        }

        if (showToast) {
          showToast('✨ Đang xoay trải nghiệm: ' + product.name.substring(0, 28) + '...');
        }

        setTimeout(() => {
          const targetId = 'product-' + product.id;
          const el = document.getElementById(targetId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('ring-4', 'ring-amber-vela', 'ring-offset-4', 'scale-[1.04]', 'shadow-2xl');
            setTimeout(() => {
              el.classList.remove('ring-4', 'ring-amber-vela', 'ring-offset-4', 'scale-[1.04]', 'shadow-2xl');
            }, 2500);
            if (showToast) showToast('✨ Đã liên kết đến: ' + product.name.substring(0, 30) + '...');
          } else {
            if (navigateTo) navigateTo('products', 'all');
            setTimeout(() => {
              const el2 = document.getElementById(targetId);
              if (el2) {
                el2.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el2.classList.add('ring-4', 'ring-amber-vela', 'ring-offset-4', 'scale-[1.04]', 'shadow-2xl');
                setTimeout(() => {
                  el2.classList.remove('ring-4', 'ring-amber-vela', 'ring-offset-4', 'scale-[1.04]', 'shadow-2xl');
                }, 2500);
              }
            }, 400);
          }
          setTimeout(() => setSpinningId(null), 1200);
        }, 850);
      };

      return (
        <section className="bg-cream-dark/50 border-y border-border py-6 px-4 md:px-8 relative shadow-xs overflow-hidden">
          <div className="max-w-screen-xl mx-auto">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2.5">
                <span className="relative flex h-3 w-3">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-vela opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-3 w-3 bg-amber-vela"></span>
                </span>
                <h3 className="font-serif text-sm md:text-base font-bold tracking-wider uppercase text-charcoal flex items-center gap-2">
                  TRẢI NGHIỆM MÙI HƯƠNG TƯƠNG TÁC VELA
                </h3>
                <span className="hidden md:inline-block text-[11px] text-muted font-body bg-ivory px-2.5 py-0.5 rounded-full border border-border">
                  Chạm vào ảnh để nổi lên, xoay tròn 360° và cuộn xem chi tiết phía dưới ↓
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => scrollWheel('left')}
                  className="w-8 h-8 rounded-full border border-border bg-ivory flex items-center justify-center text-charcoal hover:bg-charcoal hover:text-ivory transition-colors shadow-xs"
                  title="Quay trái"
                >
                  <Icon name="arrow-left" className="w-3.5 h-3.5" />
                </button>
                <button 
                  onClick={() => scrollWheel('right')}
                  className="w-8 h-8 rounded-full border border-border bg-ivory flex items-center justify-center text-charcoal hover:bg-charcoal hover:text-ivory transition-colors shadow-xs"
                  title="Quay phải"
                >
                  <Icon name="arrow-right" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>

            {/* Carousel Wheel */}
            <div 
              ref={wheelRef}
              className="flex gap-4 sm:gap-6 overflow-x-auto pb-4 pt-4 scroll-smooth scrollbar-none snap-x"
            >
              {products.map((p, idx) => {
                const isSpinning = spinningId === p.id;
                return (
                  <div 
                    key={p.id}
                    onClick={() => handleItemClick(p, idx)}
                    className="snap-start flex-shrink-0 flex flex-col items-center group cursor-pointer w-[96px] sm:w-[112px] text-center transition-all duration-300"
                  >
                    <div className={isSpinning ? "relative w-20 h-20 sm:w-22 sm:h-22 rounded-full p-[2.5px] bg-gradient-to-tr from-amber-vela via-yellow-200 to-amber-700 shadow-md transition-all duration-300 anim-float-spin" : "relative w-20 h-20 sm:w-22 sm:h-22 rounded-full p-[2.5px] bg-gradient-to-tr from-amber-vela via-yellow-200 to-amber-700 shadow-md transition-all duration-300 group-hover:shadow-amber-vela/60 group-hover:scale-105"}>
                      {isSpinning && (
                        <div className="absolute -inset-2.5 rounded-full border-2 border-dashed border-amber-vela anim-orbit pointer-events-none"></div>
                      )}
                      <div className="w-full h-full rounded-full overflow-hidden bg-ivory-dark">
                        <img 
                          src={p.images[0]} 
                          alt={p.name} 
                          className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                          onError={(e) => { e.target.onerror = null; e.target.src = './images/clean_products/serene_1.jpg'; }}
                        />
                      </div>
                      {p.badge && (
                        <span className="absolute -top-1 -right-1 text-[7.5px] font-bold px-1.5 py-0.5 rounded-full border border-amber-vela/40 bg-charcoal text-amber-vela shadow-xs">
                          {p.badge}
                        </span>
                      )}
                    </div>
                    <span className={isSpinning ? "font-serif text-[11px] font-semibold mt-2 line-clamp-1 transition-colors px-1 leading-tight text-amber-vela font-bold" : "font-serif text-[11px] font-semibold mt-2 line-clamp-1 transition-colors px-1 leading-tight text-charcoal group-hover:text-amber-vela"}>
                      {p.name.split('—')[0].replace(/^Nến Thơm VELA /i, '').replace(/^Set Quà Tặng /i, 'Set ').replace(/^Tinh Dầu Khuếch Tán VELA /i, 'Tinh Dầu ').substring(0, 18)}
                    </span>
                    <span className="text-[10px] font-body text-charcoal/80 font-medium mt-0.5">
                      {formatVND(p.price)}
                    </span>
                    {isSpinning && (
                      <span className="text-[8.5px] font-body text-amber-vela font-bold animate-pulse mt-0.5">
                        Đang xoay ↻
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    // --- PRODUCTS SHOP PAGE COMPONENT ---
    function ProductsPage({ currentCategory, onSelectCategory, onSelectProduct, addToCart, navigateTo }) {
      const [sortBy, setSortBy] = useState('featured');
      const [priceBracket, setPriceBracket] = useState('all');
      const [selectedScent, setSelectedScent] = useState('all_scents');

      const categoryInfo = CATEGORY_INFO[currentCategory] || CATEGORY_INFO.all;

      const filteredProducts = useMemo(() => {
        return PRODUCTS.filter(p => {
          if (currentCategory !== 'all' && p.category !== currentCategory) return false;
          if (selectedScent !== 'all_scents' && p.scentsProfile && !p.scentsProfile.includes(selectedScent)) return false;
          if (priceBracket === 'under_200k' && p.price >= 200000) return false;
          if (priceBracket === '200k_350k' && (p.price < 200000 || p.price > 350000)) return false;
          if (priceBracket === 'above_350k' && p.price <= 350000) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === 'price-asc') return a.price - b.price;
          if (sortBy === 'price-desc') return b.price - a.price;
          if (sortBy === 'rating') return (b.ratingScore || 0) - (a.ratingScore || 0);
          return (b.reviewCount || 0) - (a.reviewCount || 0);
        });
      }, [currentCategory, selectedScent, priceBracket, sortBy]);

      return (
        <div className="pb-24 animate-fade-in">
          {/* Shop Header Banner */}
          <div className="bg-cream-dark/60 border-b border-border text-charcoal py-10 px-4 text-center">

    function BlogPage({ onSelectArticle, blogPosts, setBlogPosts, showToast, editingPost, setEditingPost, isCreateOpen, setIsCreateOpen }) {
      const [selectedCat, setSelectedCat] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [previewMode, setPreviewMode] = useState(false);
      const [newPost, setNewPost] = useState({
        title: '',
        category: 'Hành Trình Khởi Nghiệp',
        author: 'Hoàng Thế Long — Founder VELA',
        readTime: '5 phút đọc',
        image: './images/story.jpg',
        excerpt: '',
        content: ''
      });

      // Synchronize editing post if passed from outside
      useEffect(() => {
        if (editingPost) {
          setNewPost({
            title: editingPost.title || '',
            category: editingPost.category || 'Hành Trình Khởi Nghiệp',
            author: editingPost.author || 'Hoàng Thế Long — Founder VELA',
            readTime: editingPost.readTime || '5 phút đọc',
            image: editingPost.image || './images/story.jpg',
            excerpt: editingPost.excerpt || '',
            content: editingPost.content || ''
          });
          setPreviewMode(false);
          if (setIsCreateOpen) setIsCreateOpen(true);
        }
      }, [editingPost]);

      const categories = [
        { id: 'all', label: 'Tất Cả Bài Viết' },
        { id: 'Hành Trình Khởi Nghiệp', label: 'Hành Trình Khởi Nghiệp' },
        { id: 'Kiến Thức Làm Nến', label: 'Kiến Thức Làm Nến' },
        { id: 'Digital Marketing & Branding', label: 'Marketing & Thương Hiệu' },
        { id: 'Cẩm Nang Sử Dụng', label: 'Cẩm Nang Sử Dụng' },
        { id: 'Khoa Học Mùi Hương', label: 'Khoa Học Mùi Hương' },
        { id: 'Phong Cách Sống', label: 'Phong Cách Sống' },
        { id: 'Quà Tặng Tinh Tế', label: 'Quà Tặng Tinh Tế' }
      ];

      const presetImages = [
        { label: 'Xưởng nến thủ công', url: './images/story.jpg' },
        { label: 'Sáp đậu nành & Tim gỗ', url: './images/blog1.jpg' },
        { label: 'Cẩm nang đốt nến', url: './images/blog2.jpg' },
        { label: 'Khoa học thư giãn', url: './images/blog3.jpg' },
        { label: 'Không gian sống an yên', url: './images/blog4.jpg' },
        { label: 'Hộp quà nến hoàng gia', url: './images/blog5.jpg' }
      ];

      const currentPosts = blogPosts || BLOG_POSTS;

      // Filter by category and search query
      const filteredPosts = currentPosts.filter(p => {
        const matchesCategory = selectedCat === 'all' || p.category === selectedCat;
        const query = searchQuery.trim().toLowerCase();
        const matchesQuery = !query || 
          p.title.toLowerCase().includes(query) || 
          (p.excerpt && p.excerpt.toLowerCase().includes(query)) ||
          (p.content && p.content.toLowerCase().includes(query));
        return matchesCategory && matchesQuery;
      });

      // Handle Image File Upload (FileReader -> Base64 dataURL)
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          if (showToast) showToast('Dung lượng ảnh nên dưới 8MB để tải nhanh nhất');
          return;
        }
        const reader = new FileReader();
        reader.onload = (uploadEv) => {
          setNewPost(prev => ({ ...prev, image: uploadEv.target.result }));
          if (showToast) showToast('✨ Tải ảnh đại diện bài viết thành công!');
        };
        reader.readAsDataURL(file);
      };

      // Text Formatting Helpers for Content Textarea
      const insertFormatting = (syntaxBefore, syntaxAfter = '') => {
        const textarea = document.getElementById('post-content-textarea');
        if (!textarea) return;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = newPost.content;
        const selected = text.substring(start, end);
        const replacement = syntaxBefore + (selected || 'Văn bản mẫu') + syntaxAfter;
        const nextContent = text.substring(0, start) + replacement + text.substring(end);
        setNewPost(prev => ({ ...prev, content: nextContent }));
        setTimeout(() => {
          textarea.focus();
          textarea.setSelectionRange(start + syntaxBefore.length, start + syntaxBefore.length + (selected.length || 'Văn bản mẫu'.length));
        }, 50);
      };

      // Open creation modal
      const handleOpenCreate = () => {
        if (setEditingPost) setEditingPost(null);
        setNewPost({
          title: '',
          category: 'Hành Trình Khởi Nghiệp',
          author: 'Hoàng Thế Long — Founder VELA',
          readTime: '5 phút đọc',
          image: './images/story.jpg',
          excerpt: '',
          content: ''
        });
        setPreviewMode(false);
        if (setIsCreateOpen) setIsCreateOpen(true);
      };

      // Start editing an existing post
      const handleStartEdit = (post, e) => {
        if (e) e.stopPropagation();
        if (setEditingPost) setEditingPost(post);
        setNewPost({
          title: post.title,
          category: post.category,
          author: post.author || 'Hoàng Thế Long — Founder VELA',
          readTime: post.readTime || '5 phút đọc',
          image: post.image || './images/story.jpg',
          excerpt: post.excerpt || '',
          content: post.content || ''
        });
        setPreviewMode(false);
        if (setIsCreateOpen) setIsCreateOpen(true);
      };

      // Delete post with confirmation
      const handleDeletePost = (postId, postTitle, e) => {
        if (e) e.stopPropagation();
        if (window.confirm(`Bạn có chắc chắn muốn xóa bài viết:\n"${postTitle}"?\n\nHành động này không thể hoàn tác.`)) {
          const updated = currentPosts.filter(p => p.id !== postId);
          if (setBlogPosts) setBlogPosts(updated);
          try {
            safeStorage.setItem('vela_blog_posts_v2', JSON.stringify(updated));
          } catch(err) {}
          if (showToast) showToast('Đã xóa bài viết thành công!');
        }
      };

      // Publish / Save post
      const handlePublish = (e) => {
        e.preventDefault();
        if (!newPost.title.trim() || !newPost.content.trim()) {
          if (showToast) showToast('Vui lòng điền đầy đủ tiêu đề và nội dung bài viết!');
          return;
        }

        const slug = newPost.title.toLowerCase().replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/g, '-');

        if (editingPost) {
          // Update existing
          const updated = currentPosts.map(p => {
            if (p.id === editingPost.id) {
              return {
                ...p,
                title: newPost.title.trim(),
                category: newPost.category,
                author: newPost.author.trim() || 'Hoàng Thế Long — Founder VELA',
                readTime: newPost.readTime || '5 phút đọc',
                image: newPost.image || './images/story.jpg',
                excerpt: newPost.excerpt.trim() || newPost.content.substring(0, 160) + '...',
                content: newPost.content.trim()
              };
            }
            return p;
          });
          if (setBlogPosts) setBlogPosts(updated);
          try { safeStorage.setItem('vela_blog_posts_v2', JSON.stringify(updated)); } catch(err) {}
          if (setEditingPost) setEditingPost(null);
          if (showToast) showToast('✨ Đã cập nhật bài viết thành công!');
        } else {
          // Create new
          const created = {
            id: 'b_' + Date.now(),
            slug: slug,
            title: newPost.title.trim(),
            category: newPost.category,
            author: newPost.author.trim() || 'Hoàng Thế Long — Founder VELA',

            date: new Date().toLocaleDateString('vi-VN'),

            excerpt: newPost.excerpt.trim() || newPost.content.substring(0, 160) + '...',

          if (setBlogPosts) setBlogPosts(updated);

          if (showToast) showToast('🎉 Đăng bài viết chia sẻ thành công!');
        }

        if (setIsCreateOpen) setIsCreateOpen(false);
        setNewPost({
          title: '',
          category: 'Hành Trình Khởi Nghiệp',
          author: 'Hoàng Thế Long — Founder VELA',
          readTime: '5 phút đọc',
          image: './images/story.jpg',
          excerpt: '',
          content: ''
        });
      };

      return (
        <div className="pb-24 animate-fade-in">

          <div className="bg-charcoal text-ivory py-16 px-4 text-center relative overflow-hidden">
            <div className="absolute inset-0 opacity-15 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <div className="relative z-10 max-w-3xl mx-auto">
              <span className="text-[11px] tracking-[0.3em] uppercase text-amber-vela font-body font-bold flex items-center justify-center gap-2">
                <span className="w-8 h-[1px] bg-amber-vela"></span>
                VELA JOURNAL • KHỞI NGHIỆP & NGHỆ THUẬT SỐNG

    // --- CHECKOUT & VIETQR PAYMENT GATEWAY MODAL COMPONENT ---
    function CheckoutModal({ isOpen, onClose, cart, cartTotal, clearCart, showToast, navigateTo }) {
      if (!isOpen) return null;

      const [step, setStep] = useState('form'); // 'form' | 'success'
      const [formData, setFormData] = useState(() => {
        try {
          const saved = safeStorage.getItem('vela_customer_info');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return {
          fullName: '',
          phone: '',
          email: '',
          city: 'Hà Nội',
          address: '',
          note: ''
        };
      });
      const [formErrors, setFormErrors] = useState({});
      const [isGiftWrap, setIsGiftWrap] = useState(false);
      const [isNeedGreetingCard, setIsNeedGreetingCard] = useState(false);
      const [greetingCardMessage, setGreetingCardMessage] = useState('');

      const [shippingMethod, setShippingMethod] = useState('standard'); // 'standard' | 'express'
      const [paymentMethod, setPaymentMethod] = useState('vietqr'); // 'vietqr' | 'cod' | 'momo' | 'card'
      const [voucherInput, setVoucherInput] = useState('');
      const [appliedVoucher, setAppliedVoucher] = useState(null);
      const [voucherMsg, setVoucherMsg] = useState(null);
      const [copiedField, setCopiedField] = useState(null);
      const [orderResult, setOrderResult] = useState(null);
      const [countdown, setCountdown] = useState(899); // 14:59

      // Countdown timer for VietQR payment
      useEffect(() => {
        if (step === 'success' && paymentMethod === 'vietqr' && countdown > 0) {
          const timer = setInterval(() => setCountdown(prev => prev - 1), 1000);
          return () => clearInterval(timer);
        }
      }, [step, paymentMethod, countdown]);

      // Calculate Fees
      const isFreeShipEligible = cartTotal >= 500000;
      let shippingFee = shippingMethod === 'express' ? 50000 : (isFreeShipEligible ? 0 : 30000);

      // Voucher discount
      let discountAmount = 0;
      if (appliedVoucher) {
        if (appliedVoucher.type === 'percent') {
          discountAmount = Math.round(cartTotal * appliedVoucher.value);
        } else if (appliedVoucher.type === 'fixed') {
          discountAmount = appliedVoucher.value;
        } else if (appliedVoucher.type === 'ship') {
          discountAmount = shippingFee;
        }
      }

      const finalTotal = Math.max(0, cartTotal + shippingFee - discountAmount);

      const handleApplyVoucher = (codeToApply) => {
        const code = (codeToApply || voucherInput).trim().toUpperCase();
        if (code === 'VELA10') {
          setAppliedVoucher({ code: 'VELA10', type: 'percent', value: 0.1, label: 'Giảm 10% tổng đơn hàng' });
          setVoucherMsg({ type: 'success', text: 'Đã áp dụng mã VELA10: Giảm 10% đơn hàng!' });
        } else if (code === 'FREESHIP') {
          setAppliedVoucher({ code: 'FREESHIP', type: 'ship', value: 30000, label: 'Miễn phí vận chuyển tiêu chuẩn' });
          setVoucherMsg({ type: 'success', text: 'Đã áp dụng mã FREESHIP: Miễn phí vận chuyển!' });
        } else if (code === 'WELCOME') {
          setAppliedVoucher({ code: 'WELCOME', type: 'fixed', value: 50000, label: 'Giảm 50.000đ chào bạn mới' });
          setVoucherMsg({ type: 'success', text: 'Đã áp dụng mã WELCOME: Giảm 50.000đ!' });
        } else {
          setVoucherMsg({ type: 'error', text: 'Mã ưu đãi không hợp lệ hoặc đã hết hạn.' });
        }
      };

      const handleCopy = (text, fieldName) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        }
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(null), 1800);
      };

      const handleSubmitOrder = (e) => {
        if (e) e.preventDefault();

        // Validate required fields
        const errors = {};
        if (!formData.fullName.trim()) errors.fullName = 'Vui lòng nhập họ và tên của bạn';
        if (!formData.phone.trim()) errors.phone = 'Vui lòng nhập số điện thoại nhận hàng';
        if (!formData.address.trim()) errors.address = 'Vui lòng nhập địa chỉ nhận hàng chi tiết';

        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          if (showToast) showToast('⚠️ Vui lòng điền đủ Họ tên, SĐT và Địa chỉ để mở cổng thanh toán!');
          
          // Auto scroll to top of modal smoothly
          const scrollContainer = document.getElementById('checkout-modal-container');
          if (scrollContainer) {
            scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
          }
          
          // Focus first empty field
          setTimeout(() => {
            if (errors.fullName) {
              const el = document.getElementById('input-fullName');
              if (el) el.focus();
            } else if (errors.phone) {
              const el = document.getElementById('input-phone');
              if (el) el.focus();
            } else if (errors.address) {
              const el = document.getElementById('input-address');
              if (el) el.focus();
            }
          }, 150);
          return;
        }

        setFormErrors({});
        const newOrderCode = 'VELA' + Math.floor(100000 + Math.random() * 900000);
        const orderInfo = {
          code: newOrderCode,
          items: cart,
          customer: formData,
          shippingMethod,
          paymentMethod,
          cartTotal,

    // --- CRO FLOATING CONSULTATION AI BOT WIDGET (VELA SCENT AI) ---
    function removeVietnameseTones(str) {
      if (!str) return '';
      str = str.toLowerCase();
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
      str = str.replace(/đ/g, "d");
      str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, "");
      return str;
    }

    function renderFormattedText(text) {
      if (!text) return '';
      const parts = text.split(/(\*\*.*?\*\*)/g);
      return parts.map((part, i) => {
        if (part.startsWith('**') && part.endsWith('**')) {
          return <strong key={i} className="font-semibold text-charcoal">{part.slice(2, -2)}</strong>;
        }
        return part;
      });
    }

                                  <div className="text-[10px] text-muted line-clamp-1">{product.subtitle}</div>
                                  <div className="text-[11px] font-bold text-amber-vela mt-0.5">{formatVND(product.price)}</div>
                                </div>
                                <div className="flex flex-col gap-1 shrink-0">
                                  <button
                                    onClick={() => onSelectProduct && onSelectProduct(product)}
                                    className="bg-charcoal text-ivory px-2 py-1 rounded-xs text-[10px] font-semibold hover:bg-amber-vela hover:text-charcoal transition-colors whitespace-nowrap"
                                  >
                                    Chi tiết
                                  </button>
                                  <button
                                    onClick={() => {
                                      if (addToCart) addToCart(product);
                                      if (showToast) showToast(`Đã thêm ${product.name} vào giỏ!`);
                                    }}
                                    className="border border-charcoal text-charcoal px-2 py-1 rounded-xs text-[10px] font-semibold hover:bg-charcoal hover:text-ivory transition-colors whitespace-nowrap"
                                  >
                                    + Giỏ
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}

                        <div className={`text-[9px] mt-1 text-right ${msg.sender === 'user' ? 'text-ivory/60' : 'text-muted'}`}>
                          {msg.time}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}

                {/* Typing Indicator */}
                {isTyping && (
                  <div className="flex items-center gap-2 text-muted text-xs pl-2">
                    <div className="w-6 h-6 rounded-full bg-charcoal text-amber-vela flex items-center justify-center shrink-0 border border-amber-vela/40">
                      <Icon name="sparkles" className="w-3 h-3 animate-spin" />
                    </div>
                    <div className="bg-white border border-[#E9E4DC] px-3 py-2 rounded-2xl rounded-bl-xs shadow-xs flex items-center gap-1.5">
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-vela animate-bounce"></span>
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-vela animate-bounce" style={{ animationDelay: '150ms' }}></span>
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-vela animate-bounce" style={{ animationDelay: '300ms' }}></span>
                      <span className="text-[11px] text-muted ml-1 font-medium">VELA AI đang soạn câu trả lời...</span>
                    </div>
                  </div>
                )}

                <div ref={messagesEndRef} />
              </div>

              {/* Quick Prompt Chips (Horizontal Scrollable) */}
              <div className="bg-cream-light p-2 border-t border-border overflow-x-auto flex gap-1.5 no-scrollbar shrink-0">
                {QUICK_PROMPTS.map((prompt, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSend(prompt.query)}
                    className="whitespace-nowrap bg-white hover:bg-amber-vela/10 hover:border-amber-vela border border-border/80 text-charcoal px-2.5 py-1 rounded-full text-[11px] font-medium transition-all shadow-2xs shrink-0 flex items-center gap-1 active:scale-95"
                  >
                    <span>{prompt.icon}</span>
                    <span>{prompt.label}</span>
                  </button>
                ))}
              </div>

              {/* Chat Input Field */}
              <div className="p-2.5 bg-white border-t border-border flex items-center gap-2 shrink-0">
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') handleSend();
                  }}
                  placeholder="Hỏi về mùi hương, phòng ngủ, quà tặng..."
                  className="flex-1 bg-cream-light border border-border focus:border-amber-vela focus:ring-1 focus:ring-amber-vela rounded-full px-3.5 py-2 text-xs outline-none text-charcoal placeholder:text-muted"
                />
                <button
                  onClick={() => handleSend()}
                  disabled={!input.trim()}
                  className="bg-charcoal hover:bg-amber-vela text-ivory hover:text-charcoal p-2 rounded-full transition-colors disabled:opacity-40 disabled:cursor-not-allowed shrink-0 shadow-xs"
                  title="Gửi tin nhắn"
                >
                  <svg className="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19V5m0 0l-7 7m7-7l7 7" />
                  </svg>
                </button>
              </div>

              {/* Footnote */}
              <div className="bg-cream text-[9px] text-muted text-center py-1 border-t border-border/40">
                Tư vấn tự động bởi VELA Scent AI • Hotline & Zalo: 0358 500 914
              </div>
            </div>
          )}

          {/* Trigger Button */}
          <button 
            onClick={() => {
              setIsOpen(!isOpen);
              setHasUnread(false);
            }}
            className="group bg-charcoal hover:bg-amber-vela text-ivory hover:text-charcoal px-4 py-3 rounded-full shadow-2xl border border-amber-vela/50 flex items-center gap-2.5 transition-all transform hover:scale-105 active:scale-95"
            aria-label="Tư vấn mùi hương AI"
          >
            <div className="relative">
              <Icon name="sparkles" className="w-5 h-5 text-amber-vela group-hover:text-charcoal" />
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            </div>
            <span className="text-xs font-bold tracking-wider uppercase hidden sm:inline">
              TƯ VẤN MÙI HƯƠNG AI
            </span>
            {hasUnread && !isOpen && (
              <span className="bg-amber-vela text-charcoal text-[10px] font-bold px-1.5 py-0.5 rounded-full animate-bounce">
                Mới
              </span>
            )}
          </button>
        </div>
      );
    }

    // --- FOOTER COMPONENT ---
    function Footer({ navigateTo, showToast }) {
      const [email, setEmail] = useState('');
      const [subscribed, setSubscribed] = useState(false);

      const handleSubscribe = (e) => {
        e.preventDefault();
        if (email.trim()) {
          setSubscribed(true);
          showToast('Đăng ký nhận ưu đãi VELA thành công!');
          setEmail('');
        }
      };

      return (
        <footer className="bg-charcoal text-ivory">
          {/* Newsletter Box */}
          <div className="border-b border-white/10 py-14 px-4 text-center">
            <div className="max-w-md mx-auto space-y-3">
              <h3 className="font-serif text-2xl font-light italic">Nhận ưu đãi độc quyền</h3>
              <p className="text-xs text-white/60 font-body">
                Nhận mã giảm 10% cho đơn hàng đầu tiên và cập nhật sớm nhất các bộ sưu tập hương thơm mới.
              </p>
              {subscribed ? (
                <p className="text-xs text-amber-vela font-semibold pt-2">Cảm ơn bạn đã tham gia cộng đồng VELA!</p>
              ) : (
                <form onSubmit={handleSubscribe} className="flex border border-white/20 mt-4">
                  <input 
                    type="email" 
                    required 
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="Email của bạn..." 
                    className="flex-1 bg-transparent px-4 py-2.5 text-xs font-body text-ivory outline-none placeholder:text-white/40" 
                  />
                  <button 
                    type="submit" 
                    className="bg-amber-vela text-ivory px-6 py-2.5 text-xs font-semibold font-body tracking-widest uppercase hover:bg-gold-brown transition-colors"
                  >
                    ĐĂNG KÝ
                  </button>
                </form>
              )}
            </div>
          </div>

          {/* Links Grid */}
          <div className="max-w-screen-xl mx-auto px-4 md:px-8 py-14">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-8 text-xs font-body">
              <div className="space-y-2">
                <span className="font-serif text-2xl font-semibold tracking-[0.25em] block leading-none pl-0.5">VELA</span>
                <span className="text-[9px] tracking-[0.22em] [word-spacing:0.35em] uppercase text-white/40 font-body block pb-1">
                  LUXURY SCENTED CANDLES
                </span>
                <p className="text-white/50 leading-relaxed">
                  Nến thơm cao cấp 100% sáp đậu nành thiên nhiên. Mang lại những khoảnh khắc tĩnh tại và thư giãn trọn vẹn.
                </p>
              </div>

              <div>
                <h4 className="text-[11px] uppercase tracking-widest font-semibold text-white/90 mb-3">VỀ VELA</h4>
                <ul className="space-y-2 text-white/60">
                  <li><button onClick={() => navigateTo('about', 'all')} className="hover:text-amber-vela">Câu chuyện thương hiệu</button></li>
                  <li><button onClick={() => navigateTo('products', 'all')} className="hover:text-amber-vela">Bộ sưu tập nến thơm</button></li>
                  <li><button onClick={() => navigateTo('blog', 'all')} className="hover:text-amber-vela">Góc cảm hứng & Bài viết</button></li>
                  <li><button onClick={() => navigateTo('contact', 'all')} className="hover:text-amber-vela">Hệ thống Showroom</button></li>
                </ul>
              </div>

              <div>
                <h4 className="text-[11px] uppercase tracking-widest font-semibold text-white/90 mb-3">HỖ TRỢ</h4>
                <ul className="space-y-2 text-white/60">
                  <li><a href="#" className="hover:text-amber-vela">Chính sách vận chuyển (Freeship từ 500k)</a></li>
                  <li><a href="#" className="hover:text-amber-vela">Chính sách đổi trả 1-1</a></li>
                  <li><a href="#" className="hover:text-amber-vela">Hướng dẫn sử dụng & bảo quản</a></li>
                  <li><a href="#" className="hover:text-amber-vela">Quà tặng doanh nghiệp (B2B)</a></li>
                </ul>
              </div>

              <div>
                <h4 className="text-[11px] uppercase tracking-widest font-semibold text-white/90 mb-3">LIÊN HỆ</h4>
                <div className="space-y-1.5 text-white/60">
                  <p>12 Nguyễn Huệ, P. Bến Nghé, Quận 1, TP.HCM</p>
                  <p>Hotline & Zalo: <a href="https://zalo.me/0358500914" target="_blank" rel="noreferrer" className="text-ivory hover:text-amber-vela font-bold">0358 500 914</a> (Hoàng Thế Long)</p>
                  <p>Email: <strong className="text-ivory">hello@vela.vn</strong></p>
                </div>
              </div>
            </div>

            <div className="border-t border-white/10 mt-10 pt-6 flex flex-col sm:flex-row items-center justify-between text-[11px] text-white/40">
              <div>© 2026 VELA. All rights reserved. Thắp sáng cảm xúc, chữa lành tâm hồn.</div>
              <div className="mt-2 sm:mt-0">
                <a href="./admin.html" target="_blank" className="hover:text-amber-vela/80 transition-colors flex items-center gap-1 text-[11px]">
                  <span>🔒 Quản Trị Hệ Thống (Admin)</span>
                </a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
